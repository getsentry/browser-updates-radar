name: Weekly Browser Updates Radar

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # commit state/topics.json back
  issues: write # open the weekly digest issue

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the ledger commit can rebase before pushing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch candidates
        run: node scripts/fetch-candidates.mjs

      - name: Triage with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }} # optional override; defaults to claude-sonnet-4-6
        run: node scripts/triage.mjs

      - name: Publish issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish.mjs

      - name: Persist topic ledger
        run: |
          if git diff --quiet -- state/topics.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/topics.json
          git commit -m "chore: update radar topic ledger"
          # Rebase-and-retry so a concurrent push to the branch can't reject us.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed — retrying"
            sleep 3
          done
          echo "failed to persist ledger after 3 attempts"
          exit 1
